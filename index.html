<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Heart</title>

<style>
body{
 margin:0;
 height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 background:radial-gradient(circle,#2b0000,#000);
 font-family:sans-serif;
 overflow:hidden;
}

/* TITLE */
.title{
 position:absolute;
 top:40px;
 color:white;
 font-size:40px;
 text-shadow:0 0 15px red;
}

/* HEART */
.heart-container{
 cursor:pointer;
 animation:beat 1s infinite;
}
@keyframes beat{
 0%,100%{transform:scale(1);}
 50%{transform:scale(1.2);}
}

.heart{
 width:160px;
 height:160px;
 background:red;
 transform:rotate(-45deg);
 position:relative;
 box-shadow:0 0 25px red;
}
.heart:before,.heart:after{
 content:'';
 width:160px;height:160px;
 background:red;
 border-radius:50%;
 position:absolute;
}
.heart:before{top:-80px;}
.heart:after{left:80px;}

/* PASSWORD BOX */
.password-box{
 display:none;
 position:absolute;
 background:white;
 padding:25px;
 border-radius:12px;
 text-align:center;
 box-shadow:0 0 25px black;
}

input{
 padding:8px;
 font-size:16px;
 margin-top:10px;
}

/* BOOK */
.book-container{
 display:none;
 perspective:2000px;
 margin-top:40px;
}

.book-cover{
 width:300px;
 height:400px;
 background:linear-gradient(145deg,#8B0000,#b30000);
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:10px;
 cursor:pointer;
 animation:coverPulse 2s infinite;
}

@keyframes coverPulse{
 0%,100%{transform:scale(1);}
 50%{transform:scale(1.05);}
}

.book{
 position:relative;
 width:640px;
 height:420px;
 transform-style:preserve-3d;
 display:none;
 opacity:0;
 margin-left:60px; /* SHIFT RIGHT ONLY AFTER OPEN */
}

/* PAGE */
.page{
 position:absolute;
 width:640px;
 height:420px;
 transform-origin:left center;
 transition:3s ease-in-out;
 display:flex;
 overflow:hidden;
 border-radius:10px;
 box-shadow:0 15px 40px rgba(0,0,0,0.5);
 background:white;

 transform-style:preserve-3d;
 backface-visibility:hidden;
}

/* SOLID WHITE BACK SIDE */
.page::after{
 content:"";
 position:absolute;
 inset:0;
 background:white;
 transform:rotateY(180deg);
 backface-visibility:hidden;
}

/* PAGE CONTENT */
.left,.right{
 width:50%;
 padding:15px;
 box-sizing:border-box;
}

.left img{
 width:100%;
 height:100%;
 object-fit:cover;
 border-radius:8px;
}

.right{
 background:#ffe6e6;
 color:#800000;
 text-align:center;
 font-weight:bold;
}

/* FLIP */
.page.flipped{
 transform:rotateY(-180deg);
}

/* POPUP */
.popup{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,0.9);
 display:none;
 align-items:center;
 justify-content:center;
}

.box{
 background:white;
 padding:20px;
 border-radius:12px;
 text-align:center;
}

button{
 margin:10px;
 padding:10px 20px;
 font-size:18px;
 border:none;
 border-radius:8px;
 cursor:pointer;
}
.page{
  z-index: 1;
}

#yesBtn{background:#ff4d6d;color:white;}
#noBtn{background:#ccc;}
</style>
</head>

<body>

<div class="title">My Heart ❤️</div>

<div class="heart-container" onclick="askPassword()" id="heart">
  <div class="heart"></div>
</div>

<div class="password-box" id="passBox">
<h3>Only the owner of this heart can come inside ❤️</h3>
<input type="password" id="pass" placeholder="Enter Password">
<br><br>
<button onclick="checkPass()">Enter</button>
<p id="hint" style="color:red;"></p>
</div>

<div class="book-container" id="book">

  <div class="book-cover" onclick="openBook()">
    <p>Click to open</p>
  </div>

  <div class="book" id="bookInner">

    <div class="page">
      <div class="left"><img src="first.jpeg"></div>
      <div class="right">
        <h2>The Day I Met You</h2>
        <p>You changed things around me in positive way...</p>
      </div>
    </div>

    <div class="page">
      <div class="left"><img src="rishi1.png"></div>
      <div class="right">
        <h2>My Favorite Moments</h2>
        <p>Every second with you is special ❤️</p>
      </div>
    </div>

    <div class="page">
      <div class="left"><img src="rishi.jpeg"></div>
      <div class="right">
        <h2>Wish</h2>
        <p>I want to stay with you forever...</p>
      </div>
    </div>

  </div>
</div>

<div class="popup" id="popup">
<div class="box">
<h2>Will you be mine only forever ? ❤️</h2>
<button id="yesBtn" onclick="yes()">Yes 💖</button>
<button id="noBtn" onclick="no()">No 💔</button>
</div>
</div>

<script>
function askPassword(){
 document.getElementById("heart").style.display="none";
 document.getElementById("passBox").style.display="block";
}

let currentPage=0;
let pages;

function openBook(){
 document.querySelector(".book-cover").style.display="none";
 const book=document.getElementById("bookInner");
 book.style.display="block";
 setTimeout(()=>book.style.opacity="1",50);

 pages = Array.from(document.querySelectorAll(".page"));

// stack pages: first page on top
pages.forEach((page, index) => {
  page.style.zIndex = pages.length - index;
});

flipNext();
}

function flipNext() {
  if (currentPage < pages.length) {
    pages[currentPage].classList.add("flipped");
    currentPage++;
    setTimeout(flipNext, 3200); // your slow timing
  } else {
    setTimeout(() => {
      document.getElementById("popup").style.display = "flex";
    }, 800);
  }
}


let realPass="Rishika";
function checkPass(){
 if(pass.value===realPass){
   passBox.style.display="none";
   book.style.display="block";
 }else{
   hint.innerText="Hint: just look at the mirror 😉";
 }
}

let c = 0;

function no(){
  c++;
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");

  const msgs = [
    "Are you sure? 😢",
    "Really sure? 😟",
    "Think again 💭",
    "Last chance 😭",
    "Please? 🥺",
    "Aree! bas ab ha bolo 😤"
  ];

  if (c < msgs.length) {
    noBtn.innerText = msgs[c];
  }

  yesBtn.style.fontSize = (18 + c * 6) + "px";
  yesBtn.style.padding = (10 + c * 4) + "px " + (20 + c * 6) + "px";

  if (c > 5) {
    noBtn.style.display = "none";
  }
}

function yes(){
  document.getElementById("popup").style.display = "none";
  alert("Yayyy ❤️ Happy Valentine’s Day 💖");
}
</script>

</body>
</html>
